name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore: [ "docs/**" ]

  push:
    branches: [ "master", "main" ]
    paths-ignore: [ "docs/**" ]


jobs:
  linter:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Run all pre-commit hooks on all the files.
      # Getting only staged files can be tricky in case a new PR is opened
      # since the action is run on a branch in detached head state
      - name: Install and Run Pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # With no caching at all the entire ci process takes 4m 30s to complete!
  pytest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the Stack
        run:  docker compose -f docker-compose.local.yml build

      - name: Run DB Migrations
        run:  docker compose -f docker-compose.local.yml run --rm django python manage.py migrate

      - name: Run Django Tests
        # -p no:randomly ensures deterministic ordering so order-dependent
        # failures surface consistently rather than flapping between runs.
        # -n auto parallelizes across all available CPUs (GitHub runners have 4 vCPUs).
        run:  docker compose -f docker-compose.local.yml run --rm django pytest -p no:randomly -n auto --dist loadgroup

      - name: Audit dependencies for known CVEs (pip-audit)
        # Non-blocking for now so a freshly published advisory doesn't red-wall
        # CI; review the report and tighten to blocking once the backlog is triaged.
        continue-on-error: true
        run:  docker compose -f docker-compose.local.yml run --rm django sh -c "pip install --quiet pip-audit && pip-audit"

      - name: Tear down the Stack
        if: always()
        run:  docker compose -f docker-compose.local.yml down

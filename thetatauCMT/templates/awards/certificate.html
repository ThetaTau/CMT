{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Certificate of Award</title>
  <style>
    body { font-family: "Helvetica", "Arial", sans-serif; text-align: center; padding: 2cm; }
    .border { border: 4px double #a00e11; padding: 1.5cm; }
    h1 { color: #a00e11; letter-spacing: 2px; }
    .recipient { font-size: 28px; margin: 0.4cm 0; }
    .award { font-size: 22px; color: #a00e11; margin: 0.3cm 0; }
    .meta { color: #444; margin-top: 0.6cm; }
    .reason { font-style: italic; margin-top: 0.6cm; }
  </style>
</head>
<body>
  <div class="border">
    <h1>Certificate of Award</h1>
    <p>This certifies that</p>
    <p class="recipient">{{ recipient }}</p>
    <p>is hereby recognized with the</p>
    <p class="award">{{ award_name }}</p>
    <p>for the <strong>{{ cycle_name }}</strong> award period.</p>
    <p class="meta">Effective {{ effective_date }}.</p>
    {% if reason %}<p class="reason">{{ reason }}</p>{% endif %}
  </div>
</body>
</html>
